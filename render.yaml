services:
  - type: web
    name: ambedkar-digital-archive
    runtime: node
    plan: free
    region: oregon
    rootDir: ambedkar-archive
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
